services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: colorapi
      POSTGRES_USER: colorapi
      POSTGRES_PASSWORD: colorapi
    ports:
      - "5432:5432"
    volumes:
      - colorapi-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colorapi -d colorapi"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://colorapi:colorapi@db:5432/colorapi
    depends_on:
      db:
        condition: service_healthy

volumes:
  colorapi-data:
